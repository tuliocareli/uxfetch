<!-- BLOCO DA VAGA RECENTE (REPETE POR VAGA) -->
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#FFFFFF; border:1px solid #E4E4E7; border-radius:8px; margin-bottom:12px;">
  <tr>
    <td style="padding:16px;">
      <span style="display:inline-block; padding:4px 8px; background-color:{{cor_fundo_modelo}}; color:{{cor_texto_modelo}}; border-radius:4px; font-size:10px; font-weight:600; margin-bottom:8px; text-transform:uppercase;">
        {{modelo_trabalho}} ({{regime}})
      </span>
      <h3 style="margin:0 0 6px 0; font-size:15px; font-weight:600; color:#0A0A0A;">
        {{titulo_cargo}} &mdash; {{empresa}}
      </h3>
      <table width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td align="left" style="font-size:13px; color:#71717A;">
            📍 {{cidade}}
          </td>
          <td align="right">
            <a href="{{url_vaga}}" target="_blank" style="font-size:13px; color:#0055FF; text-decoration:none; font-weight:600;">Ver Vaga &rarr;</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
