<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UX Fetch | Admin CMS</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    
    <!-- Quill WYSIWYG Editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #f4f4f5; }
        .admin-container { max-width: 900px; margin: 40px auto; padding: 40px; background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; border-bottom: 1px solid #e2e8f0; padding-bottom: 16px; }
        .admin-header h1 { font-size: 1.5rem; margin: 0; }
        
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; }
        .form-group textarea { min-height: 200px; resize: vertical; }
        
        .btn-submit { background: var(--primary); color: white; padding: 12px 24px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background: var(--primary-dark); }
        
        .status-msg { padding: 16px; border-radius: 8px; margin-bottom: 24px; display: none; }
        .status-msg.success { background: #dcfce7; color: #166534; display: block; }
        .status-msg.error { background: #fee2e2; color: #991b1b; display: block; }
        
        /* Lista de Posts */
        .post-card { display: flex; justify-content: space-between; align-items: center; padding: 16px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc; }
        .post-info h3 { margin: 0 0 8px 0; font-size: 1.1rem; }
        .post-info span { font-size: 0.85rem; padding: 4px 8px; border-radius: 4px; font-weight: 500; }
        .status-published { background: #dcfce7; color: #166534; }
        .status-draft { background: #e2e8f0; color: #475569; }
        .post-actions button { margin-left: 8px; padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
        .btn-edit { background: #eff6ff; color: #1d4ed8; }
        .btn-delete { background: #fef2f2; color: #b91c1c; }

        /* Estilos do Preview do Card */
        .uxf-card { display: block; border-radius: 20px; overflow: hidden; text-decoration: none; background: #F0F5FF; border: 1px solid #B7CFFF; color: #231F20; }
        .uxf-card-content { padding: 16px 20px; background: white; border-top: 1px solid #B7CFFF; display: flex; flex-direction: column; justify-content: center; }
        .uxf-tag { display: inline-block; background: #E5EBF9; color: #0055FF; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 6px 12px; border-radius: 100px; margin-bottom: 12px; }
        .uxf-book-title { font-size: 1.1rem; font-weight: 700; margin: 0 0 4px 0; color: #231F20; text-decoration: none; }
        .uxf-book-desc { font-size: 0.85rem; color: #4A5568; margin: 0; text-decoration: none; }

        /* Estilos do Editor Quill */
        .ql-toolbar.ql-snow {
            border: 1px solid #cbd5e1;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            font-family: 'Space Grotesk', sans-serif;
            background: #f8fafc;
        }
        .ql-container.ql-snow {
            border: 1px solid #cbd5e1;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            min-height: 400px;
            font-family: inherit;
            font-size: 1.05rem;
        }
        .ql-editor { padding: 24px; }
        
        /* Estilos herdados para o Preview */
        .article-container { max-width: 800px; margin: 40px auto; padding: 20px; background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .article-header { text-align: center; margin-bottom: 40px; }
        .article-title { font-size: 2.5rem; font-weight: 800; color: var(--text-dark); margin-bottom: 16px; }
        .article-meta { color: #718096; font-size: 0.9rem; }
        .article-cover { width: 100%; max-height: 400px; object-fit: cover; border-radius: 16px; margin-bottom: 40px; }
        .article-content { font-size: 1.1rem; line-height: 1.8; color: var(--text-dark); }
        .article-content h2 { margin-top: 40px; margin-bottom: 16px; }
        .article-content p { margin-bottom: 16px; }
        .article-content img { max-width: 100%; height: auto; border-radius: 8px; margin: 16px 0; display: block; }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>CMS Básico - Blog UX Fetch</h1>
            <div>
                <button id="logoutBtn" class="btn-outline" style="padding: 8px 16px; font-size: 0.9rem; display: none; margin-right: 12px; cursor: pointer;">Sair</button>
                <a href="../index.html" class="btn-outline" style="padding: 8px 16px; font-size: 0.9rem;">Voltar ao Site</a>
            </div>
        </div>

        <div id="statusMsg" class="status-msg"></div>

        <!-- TELA DE LOGIN -->
        <div id="loginSection">
            <h2 style="margin-top: 0;">Acesso Restrito</h2>
            <p style="margin-bottom: 24px; color: #4A5568;">Faça login com seu e-mail de administrador para gerenciar o blog.</p>
            <form id="loginForm">
                <div class="form-group" id="emailGroup">
                    <label for="adminEmail">E-mail de Acesso</label>
                    <input type="email" id="adminEmail" required placeholder="admin@uxfetch.com">
                </div>
                
                <div class="form-group" id="passwordGroup">
                    <label for="adminPassword">Senha</label>
                    <input type="password" id="adminPassword" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn-submit" id="loginBtn" style="width: 100%;">Entrar no CMS</button>
            </form>
        </div>

        <!-- TELA DO CMS (Oculta por padrão) -->
        <div id="cmsSection" style="display: none;">
            
            <!-- HUB CENTRAL -->
            <div id="hubView">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                    <h2 style="margin: 0; font-size: 1.5rem;">Seus Artigos</h2>
                    <button id="btnNewPost" class="btn-submit">+ Criar Novo</button>
                </div>
                
                <div id="postsList" style="display: flex; flex-direction: column; gap: 16px;">
                    <!-- Lista de artigos será injetada aqui -->
                </div>
            </div>

            <!-- EDITOR DE POST -->
            <div id="editorView" style="display: none;">
                <div style="margin-bottom: 24px;">
                    <button id="btnBackToHub" style="background: none; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 500;">&larr; Voltar para os Artigos</button>
                </div>
                <form id="postForm">
                    <div class="form-group">
                        <label for="titulo">Título do Post</label>
                        <input type="text" id="titulo" required placeholder="Ex: As 5 Leis de UX que você precisa saber">
                    </div>
                    
                    <div class="form-group">
                        <label for="slug">Slug (URL amigável)</label>
                        <input type="text" id="slug" required placeholder="Ex: as-5-leis-de-ux">
                    </div>
                    
                    <div class="form-group">
                        <label for="imagem_capa">URL da Imagem de Capa (Opcional)</label>
                        <input type="url" id="imagem_capa" placeholder="https://...">
                    </div>
                    
                    <div class="form-group">
                        <label for="imagem_capa_alt">Alt Text da Capa (Acessibilidade/SEO)</label>
                        <input type="text" id="imagem_capa_alt" placeholder="Descreva a imagem de capa (ex: Homem usando notebook no escritório...)">
                    </div>

                    <div class="form-group">
                        <label for="imagem_capa_legenda">Legenda da Capa (Opcional)</label>
                        <input type="text" id="imagem_capa_legenda" placeholder="Texto visível abaixo da imagem de capa">
                    </div>

                    <div class="form-group">
                        <label for="resumo">Resumo (Para o Card da Home)</label>
                        <textarea id="resumo" required placeholder="Pequeno texto chamativo..." style="min-height: 80px;"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label>Conteúdo do Artigo</label>
                        <div id="editor-container"></div>
                    </div>
                    
                    <div style="display: flex; gap: 16px;">
                        <div class="form-group" style="width: 200px;">
                            <label for="status">Status</label>
                            <select id="status">
                                <option value="draft">Rascunho (Oculto)</option>
                                <option value="published">Publicado</option>
                            </select>
                        </div>
                        <div class="form-group" style="width: 300px;">
                            <label for="autor">Autor</label>
                            <select id="autor">
                                <option value="equipe">Equipe UXfetch</option>
                                <option value="tulio">Túlio Careli</option>
                            </select>
                        </div>
                    </div>
                    
                    <div style="display: flex; gap: 16px;">
                        <button type="submit" class="btn-submit" id="submitBtn">Salvar Post</button>
                        <button type="button" class="btn-outline" id="btnPreview" style="padding: 12px 24px; font-weight: 700;">Ver Prévia</button>
                    </div>
                </form>
            </div>
            
            <!-- PREVIEW VIEW -->
            <div id="previewView" style="display: none;">
                <div style="margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center;">
                    <button id="btnBackToEditor" style="background: none; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 500;">&larr; Voltar para Edição</button>
                    <span style="font-size: 0.85rem; color: #718096; background: #e2e8f0; padding: 4px 12px; border-radius: 12px;">Modo Visualização</span>
                </div>
                
                <h3 style="margin-top: 40px; border-bottom: 1px solid #cbd5e1; padding-bottom: 8px;">Prévia do Card (Página Inicial)</h3>
                <div style="max-width: 280px; margin: 24px 0;">
                    <div class="uxf-card" style="pointer-events: none;">
                        <div class="uxf-card-img-wrapper" style="padding: 0; height: 160px;">
                            <img class="uxf-card-img" id="previewCardImg" style="object-fit: cover; width: 100%; height: 100%; border-radius: 20px 20px 0 0;" src="" alt="">
                        </div>
                        <div class="uxf-card-content" style="height: 150px;">
                            <div class="uxf-tag" style="margin-bottom: 8px; width: fit-content;">Artigo</div>
                            <h3 class="uxf-book-title" id="previewCardTitle" style="font-size: 1rem; margin-bottom: 8px;"></h3>
                            <p class="uxf-book-desc" id="previewCardDesc" style="font-size: 0.8rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;"></p>
                        </div>
                    </div>
                </div>

                <h3 style="margin-top: 40px; border-bottom: 1px solid #cbd5e1; padding-bottom: 8px;">Prévia do Artigo Completo</h3>
                <div class="article-container" style="margin: 24px 0; border: 1px dashed #cbd5e1;">
                    <div class="article-header">
                        <h1 class="article-title" id="previewArticleTitle"></h1>
                        <div class="article-meta">Publicado em <span id="previewArticleDate"></span></div>
                    </div>
                    <figure id="previewArticleFigure" style="margin: 0 0 40px 0; text-align: center; display: none;">
                        <img src="" alt="" class="article-cover" id="previewArticleImg" style="margin-bottom: 8px;">
                        <figcaption id="previewArticleCaption" style="color: #718096; font-size: 0.9rem; font-style: italic;"></figcaption>
                    </figure>
                    <div class="article-content" id="previewArticleContent">
                    </div>
                    
                    <div id="previewAuthorBox" style="margin-top: 60px; padding-top: 32px; border-top: 1px solid #e2e8f0; display: flex; align-items: center; gap: 16px;">
                        <img id="previewAuthorImg" src="" alt="Autor" style="width: 56px; height: 56px; border-radius: 50%; object-fit: cover;">
                        <div>
                            <div id="previewAuthorName" style="font-weight: 700; font-size: 1.1rem; color: var(--text-dark);"></div>
                            <div id="previewAuthorRole" style="font-size: 0.9rem; color: #4A5568; margin-bottom: 4px;"></div>
                            <div style="font-size: 0.8rem; color: #718096;">
                                Publicado em: <span id="previewDatePub"></span> &bull; Atualizado em: <span id="previewDateUpd"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal Custom Image para Quill -->
    <div id="imageModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: white; padding: 24px; border-radius: 12px; width: 400px; max-width: 90%;">
            <h3 style="margin-top: 0; margin-bottom: 16px;">Inserir Imagem</h3>
            <div class="form-group">
                <label for="modalImgUrl">URL da Imagem</label>
                <input type="url" id="modalImgUrl" placeholder="https://...">
            </div>
            <div class="form-group">
                <label for="modalImgAlt">Texto Alternativo (Alt Text)</label>
                <input type="text" id="modalImgAlt" placeholder="Descreva a imagem (Importante para o Google)">
            </div>
            <div class="form-group">
                <label for="modalImgCaption">Legenda (Opcional)</label>
                <input type="text" id="modalImgCaption" placeholder="Texto visível abaixo da imagem">
            </div>
            <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px;">
                <button type="button" class="btn-outline" id="btnCancelImage" style="width: auto; padding: 8px 16px;">Cancelar</button>
                <button type="button" class="btn-submit" id="btnInsertImage" style="width: auto; padding: 8px 16px;">Inserir</button>
            </div>
        </div>
    </div>

    <script src="blog.js"></script>
</body>
</html>
