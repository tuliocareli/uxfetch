<!-- BLOCO DA VAGA (REPETE POR VAGA) -->
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F4F4F5; border-radius:8px; margin-bottom:16px;">
  <tr>
    <td style="padding:24px;">
      <span style="display:inline-block; padding:4px 8px; background-color:#E0E7FF; color:#0055FF; border-radius:4px; font-size:12px; font-weight:600; margin-bottom:12px; text-transform:uppercase;">
        {{modelo_trabalho}} ({{regime}})
      </span>
      <h2 style="margin:0 0 8px 0; font-size:18px; font-weight:700; color:#0A0A0A;">
        {{titulo_cargo}} &mdash; {{empresa}}
      </h2>
      <p style="margin:0 0 12px 0; font-size:14px; color:#71717A; font-weight:500;">
        📍 {{cidade}}
      </p>
      <p style="margin:0 0 24px 0; font-size:14px; line-height:20px; color:#0A0A0A;">
        {{breve_descricao}}
      </p>
      <table cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td align="center" style="border-radius:4px; background-color:#0055FF;">
            <a href="{{url_vaga}}" target="_blank" style="font-size:14px; font-family:Inter, Helvetica, Arial, sans-serif; color:#ffffff; text-decoration:none; border-radius:4px; padding:12px 24px; border:1px solid #0055FF; display:inline-block; font-weight:600;">Ver Vaga Completa</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
