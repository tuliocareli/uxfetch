<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando... | UX Fetch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon.png">
    <meta name="theme-color" content="#ffffff">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #0055ff;
            --bg: #ffffff;
            --text: #0a0a0a;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .logo {
            width: 150px;
            margin-bottom: 24px;
        }
        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e7ff;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            color: var(--text);
            margin: 0 0 8px 0;
        }
        p {
            color: #64748b;
            font-size: 14px;
            margin: 0;
        }
    </style>
</head>
<body>
    <img src="assets/logo.svg" alt="UX Fetch" class="logo">
    <div class="loader"></div>
    <h1>Preparando sua vaga...</h1>
    <p>Você está sendo redirecionado de forma segura.</p>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const jobId = urlParams.get('id');

            if (!jobId) {
                document.body.innerHTML = '<h1>Vaga não encontrada</h1><p>O link acessado é inválido ou está quebrado.</p><a href="/">Voltar ao início</a>';
                return;
            }

            try {
                // Initialize Supabase Client
                const SUPABASE_URL = 'https://wxogmhruwhjvhhgmfvrr.supabase.co';
                const SUPABASE_ANON_KEY = 'sb_publishable_YP0GmSgpgugyAnjan6I3bQ_Gaf4CSGI';
                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                // Fetch the job URL using the UUID
                const { data, error } = await supabase
                    .from('jobs')
                    .select('url')
                    .eq('id', jobId)
                    .single();

                if (error || !data || !data.url) {
                    throw new Error('Vaga não localizada no banco.');
                }

                // Redirect user to the external job URL
                window.location.replace(data.url);
            } catch (err) {
                console.error(err);
                document.body.innerHTML = '<h1>Erro ao redirecionar</h1><p>Não foi possível localizar a página de destino da vaga.</p><a href="/vagas">Ver mural de vagas</a>';
            }
        });
    </script>
</body>
</html>
