<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UX Fetch | Admin CMS</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #f4f4f5; }
        .admin-container { max-width: 900px; margin: 40px auto; padding: 40px; background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; border-bottom: 1px solid #e2e8f0; padding-bottom: 16px; }
        .admin-header h1 { font-size: 1.5rem; margin: 0; }
        
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; }
        .form-group textarea { min-height: 200px; resize: vertical; }
        
        .btn-submit { background: var(--primary); color: white; padding: 12px 24px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background: var(--primary-dark); }
        
        .status-msg { padding: 16px; border-radius: 8px; margin-bottom: 24px; display: none; }
        .status-msg.success { background: #dcfce7; color: #166534; display: block; }
        .status-msg.error { background: #fee2e2; color: #991b1b; display: block; }
        
        /* Lista de Posts */
        .post-card { display: flex; justify-content: space-between; align-items: center; padding: 16px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc; }
        .post-info h3 { margin: 0 0 8px 0; font-size: 1.1rem; }
        .post-info span { font-size: 0.85rem; padding: 4px 8px; border-radius: 4px; font-weight: 500; }
        .status-published { background: #dcfce7; color: #166534; }
        .status-draft { background: #e2e8f0; color: #475569; }
        .post-actions button { margin-left: 8px; padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
        .btn-edit { background: #eff6ff; color: #1d4ed8; }
        .btn-delete { background: #fef2f2; color: #b91c1c; }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>CMS Básico - Blog UX Fetch</h1>
            <div>
                <button id="logoutBtn" class="btn-outline" style="padding: 8px 16px; font-size: 0.9rem; display: none; margin-right: 12px; cursor: pointer;">Sair</button>
                <a href="../index.html" class="btn-outline" style="padding: 8px 16px; font-size: 0.9rem;">Voltar ao Site</a>
            </div>
        </div>

        <div id="statusMsg" class="status-msg"></div>

        <!-- TELA DE LOGIN -->
        <div id="loginSection">
            <h2 style="margin-top: 0;">Acesso Restrito</h2>
            <p style="margin-bottom: 24px; color: #4A5568;">Faça login com seu e-mail de administrador para gerenciar o blog.</p>
            <form id="loginForm">
                <div class="form-group" id="emailGroup">
                    <label for="adminEmail">E-mail de Acesso</label>
                    <input type="email" id="adminEmail" required placeholder="admin@uxfetch.com">
                </div>
                
                <div class="form-group" id="passwordGroup">
                    <label for="adminPassword">Senha</label>
                    <input type="password" id="adminPassword" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn-submit" id="loginBtn" style="width: 100%;">Entrar no CMS</button>
            </form>
        </div>

        <!-- TELA DO CMS (Oculta por padrão) -->
        <div id="cmsSection" style="display: none;">
            
            <!-- HUB CENTRAL -->
            <div id="hubView">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                    <h2 style="margin: 0; font-size: 1.5rem;">Seus Artigos</h2>
                    <button id="btnNewPost" class="btn-submit">+ Criar Novo</button>
                </div>
                
                <div id="postsList" style="display: flex; flex-direction: column; gap: 16px;">
                    <!-- Lista de artigos será injetada aqui -->
                </div>
            </div>

            <!-- EDITOR DE POST -->
            <div id="editorView" style="display: none;">
                <div style="margin-bottom: 24px;">
                    <button id="btnBackToHub" style="background: none; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 500;">&larr; Voltar para os Artigos</button>
                </div>
                <form id="postForm">
                    <div class="form-group">
                        <label for="titulo">Título do Post</label>
                        <input type="text" id="titulo" required placeholder="Ex: As 5 Leis de UX que você precisa saber">
                    </div>
                    
                    <div class="form-group">
                        <label for="slug">Slug (URL amigável)</label>
                        <input type="text" id="slug" required placeholder="Ex: as-5-leis-de-ux">
                    </div>
                    
                    <div class="form-group">
                        <label for="imagem_capa">URL da Imagem de Capa (Opcional)</label>
                        <input type="url" id="imagem_capa" placeholder="https://exemplo.com/imagem.png">
                    </div>
                    
                    <div class="form-group">
                        <label for="resumo">Resumo (Para o Card da Home)</label>
                        <textarea id="resumo" required placeholder="Pequeno texto chamativo..." style="min-height: 80px;"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="conteudo">Conteúdo (Markdown ou Texto/HTML)</label>
                        <textarea id="conteudo" required placeholder="Escreva o artigo aqui..."></textarea>
                    </div>
                    
                    <div class="form-group" style="width: 200px;">
                        <label for="status">Status</label>
                        <select id="status">
                            <option value="draft">Rascunho (Oculto)</option>
                            <option value="published">Publicado</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn-submit" id="submitBtn">Salvar Post</button>
                </form>
            </div>
        </div>
    </div>

    <script src="blog.js"></script>
</body>
</html>
