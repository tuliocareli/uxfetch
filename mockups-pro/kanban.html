<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Kanban - UX Fetch Pro</title>
    <!-- Fonte Moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Design System - Light Mode Premium */
            --bg-body: #F7F9FC;
            --bg-panel: #FFFFFF;
            --bg-card: #FFFFFF;
            --bg-card-hover: #F8FAFC;
            --bg-column: #F1F5F9;
            
            --text-main: #1E293B;
            --text-muted: #64748B;
            
            --border-light: #E2E8F0;
            --accent: #3B82F6;
            --accent-hover: #2563EB;
            
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius-md: 8px;
            --radius-lg: 12px;
            
            font-family: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* CABEÇALHO */
        .app-header {
            background-color: var(--bg-panel);
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-bottom: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            z-index: 10;
        }

        .logo h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .credits-counter {
            background-color: #EFF6FF;
            color: var(--accent-hover);
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 0.875rem;
            font-weight: 500;
            border: 1px solid #BFDBFE;
        }

        /* LAYOUT PRINCIPAL */
        .dashboard-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* KANBAN BOARD */
        .kanban-board {
            flex: 1;
            display: flex;
            gap: 20px;
            padding: 24px;
            overflow-x: auto;
            background-color: var(--bg-body);
        }

        .kanban-column {
            background-color: var(--bg-column);
            min-width: 300px;
            max-width: 300px;
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .column-header h2 {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .card-count {
            background-color: var(--border-light);
            color: var(--text-muted);
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 99px;
            font-weight: 600;
        }

        .kanban-cards-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            flex: 1;
        }

        .job-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            padding: 16px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            cursor: grab;
            transition: all 0.2s ease;
        }

        .job-card:hover {
            box-shadow: var(--shadow-md);
            border-color: #CBD5E1;
            transform: translateY(-2px);
        }

        .job-card.active {
            border: 2px solid var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .job-card h3 {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .job-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* SIDEBAR DO MENTOR */
        .mentor-sidebar {
            width: 360px;
            background-color: var(--bg-panel);
            border-left: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 15px rgba(0,0,0,0.02);
            z-index: 5;
        }

        .mentor-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-light);
            background-color: #F8FAFC;
        }

        .mentor-header h2 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .active-job-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .action-list {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .mentor-action-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            padding: 14px 16px;
            border-radius: var(--radius-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        .mentor-action-btn:hover {
            border-color: var(--accent);
            background-color: #F0F9FF;
        }

        .action-title {
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .action-cost {
            font-size: 0.75rem;
            color: var(--text-muted);
            background-color: var(--bg-body);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-light);
        }

        .private-notes {
            padding: 0 24px 24px 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .private-notes label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .private-notes textarea {
            flex: 1;
            resize: none;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 12px;
            font-family: inherit;
            font-size: 0.875rem;
            color: var(--text-main);
            background-color: var(--bg-body);
        }
        
        .private-notes textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="logo">
            <h1>UX Fetch Pro</h1>
        </div>
        <div class="credits-counter">
            <strong>27</strong> créditos restantes
        </div>
    </header>

    <main class="dashboard-layout">

        <section class="kanban-board">
            
            <div class="kanban-column" data-status="interesse">
                <header class="column-header">
                    <h2>Interesse</h2>
                    <span class="card-count">3</span>
                </header>
                <div class="kanban-cards-container">
                    <article class="job-card">
                        <h3>Product Designer Pleno</h3>
                        <p class="job-meta">Gupy &middot; São Paulo</p>
                    </article>
                    <article class="job-card">
                        <h3>UX Researcher</h3>
                        <p class="job-meta">Trampos &middot; Remoto</p>
                    </article>
                </div>
            </div>

            <div class="kanban-column" data-status="cv_enviado">
                <header class="column-header">
                    <h2>CV enviado</h2>
                    <span class="card-count">2</span>
                </header>
                <div class="kanban-cards-container">
                    <article class="job-card">
                        <h3>UI Designer Sênior</h3>
                        <p class="job-meta">Remotar &middot; Remoto</p>
                    </article>
                </div>
            </div>

            <div class="kanban-column" data-status="entrevista">
                <header class="column-header">
                    <h2>Entrevista</h2>
                    <span class="card-count">1</span>
                </header>
                <div class="kanban-cards-container">
                    <article class="job-card active">
                        <h3>Design Engineer</h3>
                        <p class="job-meta">Nubank &middot; Híbrido</p>
                    </article>
                </div>
            </div>

            <div class="kanban-column" data-status="proposta">
                <header class="column-header">
                    <h2>Proposta</h2>
                    <span class="card-count">0</span>
                </header>
                <div class="kanban-cards-container">
                </div>
            </div>

        </section>

        <aside class="mentor-sidebar">
            <header class="mentor-header">
                <h2>Mentor de carreira</h2>
                <p class="active-job-title">Design Engineer, Nubank</p>
            </header>

            <nav class="action-list">
                <button class="mentor-action-btn">
                    <span class="action-title">Match realista</span>
                    <span class="action-cost">1 crédito</span>
                </button>
                <button class="mentor-action-btn">
                    <span class="action-title">Reescrever p/ ATS</span>
                    <span class="action-cost">1 crédito</span>
                </button>
                <button class="mentor-action-btn">
                    <span class="action-title">Mock interview</span>
                    <span class="action-cost">1 crédito</span>
                </button>
                <button class="mentor-action-btn">
                    <span class="action-title">Plano de estudo</span>
                    <span class="action-cost">1 crédito</span>
                </button>
            </nav>

            <section class="private-notes">
                <label for="notes-textarea">Notas privadas</label>
                <textarea id="notes-textarea" placeholder="Anotações para essa vaga..."></textarea>
            </section>
        </aside>

    </main>

</body>
</html>
